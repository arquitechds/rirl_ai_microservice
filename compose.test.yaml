services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: disposable-test-password
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: test_queue
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdisposable-test-password"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks: [test]
  tests:
    image: rirl-union-dues:local
    depends_on:
      mysql-test:
        condition: service_healthy
    environment:
      DB_HOST: mysql-test
      DB_NAME: test_queue
      DB_USER: root
      DB_PASSWORD: disposable-test-password
      DB_SSLMODE: disable
      QUEUE_INTEGRATION_TEST: disposable-mysql
    volumes:
      - ./tests:/app/tests:ro
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    networks: [test]
networks:
  test:
    internal: true
